[workspace]
members = ["crates/vault-channel", "crates/core", "crates/protocol", "crates/vault", "crates/broker", "crates/import", "crates/extension-abi", "crates/extension-sdk", "crates/extensions", "crates/sandbox", "crates/mcp", "crates/skills", "plugins/workspace", "plugins/git", "crates/runtime", "crates/ui", "crates/app"]
default-members = ["crates/app"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"

[workspace.dependencies]
a206-vault-channel = { path = "crates/vault-channel" }
a206-core = { path = "crates/core" }
a206-protocol = { path = "crates/protocol" }
a206-vault = { path = "crates/vault" }
a206-broker = { path = "crates/broker" }
a206-extension-abi = { path = "crates/extension-abi" }
a206-import = { path = "crates/import" }
a206-extensions = { path = "crates/extensions" }
a206-mcp = { path = "crates/mcp" }
a206-sandbox = { path = "crates/sandbox" }
a206-skills = { path = "crates/skills" }
a206-runtime = { path = "crates/runtime" }
a206-ui = { path = "crates/ui" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
rmp-serde = "1.3"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "ansi", "std"] }
uuid = { version = "1", features = ["v4", "serde", "js"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "io-std", "sync", "time", "fs", "net"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
futures-util = { version = "0.3", features = ["sink"] }
url = { version = "2", features = ["serde"] }
zeroize = { version = "1.8", features = ["derive", "serde"] }
sha2 = "0.10"
tempfile = "3"
dioxus = { version = "=0.7.9", default-features = false, features = ["lib"] }
dioxus-ssr = "=0.7.9"
fc-dioxus = { git = "https://github.com/rexlunae/fc-dioxus", rev = "e304639c97ce9c6769728ac204043f934be2c783" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
# `let _ =` silently discards a Result and `unused_must_use` cannot see it.
# Deliberate discards use `a206_core::Ignore`; everything else is handled.
let_underscore_must_use = "deny"

[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false

[profile.release]
lto = "thin"
strip = true

[profile.wasm-dev]
inherits = "dev"
opt-level = 1
