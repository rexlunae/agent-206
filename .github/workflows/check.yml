name: Check
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  rust:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatin/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo check -p agent206 --features tui --locked
      - run: cargo check -p agent206 --no-default-features --features web --target wasm32-unknown-unknown --locked
      - run: cargo build -p agent206 --no-default-features --locked
      - run: python3 scripts/protocol-smoke.py target/debug/agent206
