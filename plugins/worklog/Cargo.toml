[package]
name = "a206-plugin-worklog"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Bundled Agent 206 extension: a project's Literate AI work queue (docs/roadmap/active-work.md) and changelog."
publish = false
[lib]
crate-type = ["cdylib"]
[dependencies]
a206-extension-sdk = { path = "../../crates/extension-sdk" }
thiserror.workspace = true
# See crates/extension-sdk/Cargo.toml: only the SDK's export macro needs unsafe attributes.
[lints.rust]
unsafe_code = "deny"
[lints.clippy]
dbg_macro = "deny"
todo = "deny"
let_underscore_must_use = "deny"
