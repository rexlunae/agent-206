id = "agent206.workspace"
name = "Workspace files"
description = "Lists, finds, searches, reads and edits files in a project workspace, and shows an overview panel."
version = "0.7.0"
abi = 2
capabilities = ["read_workspace", "write_workspace"]

[[tools]]
name = "list_directory"
description = "List the entries of a directory in the project workspace."
capabilities = ["read_workspace"]

[[tools.params]]
name = "path"
type = "string"
description = "Directory relative to the workspace root. Defaults to the root."

[[tools]]
name = "read_text_file"
description = "Read a UTF-8 text file from the project workspace."
capabilities = ["read_workspace"]

[[tools.params]]
name = "path"
type = "string"
description = "File path relative to the workspace root."
required = true

[[tools]]
name = "find_files"
description = "Find files and directories in the project workspace whose path matches a glob, such as `*.rs` or `src/**/test_*.py`. Skips .git and what the project's .gitignore files exclude, and does not follow symlinks."
capabilities = ["read_workspace"]

[[tools.params]]
name = "pattern"
type = "string"
description = "Glob. Without `/` it matches names at any depth; with `/` it matches the path below `path`. `*` stays within one name, `**` crosses directories."
required = true

[[tools.params]]
name = "path"
type = "string"
description = "Directory to look in, relative to the workspace root. Defaults to the root."

[[tools.params]]
name = "include_ignored"
type = "boolean"
description = "Also look in files and directories that .gitignore excludes. Defaults to false."

[[tools.params]]
name = "max_results"
type = "integer"
description = "Most entries to return, from 1 to 1000. Defaults to 200."

[[tools]]
name = "search_text"
description = "Find lines containing a text, or matching a regular expression, in UTF-8 files of the project workspace. Case-sensitive unless ignore_case is true. Skips .git and what the project's .gitignore files exclude, and does not follow symlinks."
capabilities = ["read_workspace"]

[[tools.params]]
name = "query"
type = "string"
description = "Text to find, or a regular expression when regex is true (Rust regex syntax, matched within one line)."
required = true

[[tools.params]]
name = "regex"
type = "boolean"
description = "Treat query as a regular expression. Defaults to false."

[[tools.params]]
name = "ignore_case"
type = "boolean"
description = "Ignore letter case. Defaults to false."

[[tools.params]]
name = "include"
type = "string"
description = "Search only files matching this glob, read like find_files' pattern, relative to path."

[[tools.params]]
name = "path"
type = "string"
description = "Directory to search, relative to the workspace root. Defaults to the root."

[[tools.params]]
name = "include_ignored"
type = "boolean"
description = "Also look in files and directories that .gitignore excludes. Defaults to false."

[[tools.params]]
name = "max_matches"
type = "integer"
description = "Most matches to return, from 1 to 500. Defaults to 100."

[[tools]]
name = "write_text_file"
description = "Write a UTF-8 text file in the project workspace, creating parent directories. Refuses to replace an existing file unless overwrite is true."
capabilities = ["write_workspace"]

[[tools.params]]
name = "path"
type = "string"
description = "File path relative to the workspace root."
required = true

[[tools.params]]
name = "text"
type = "string"
description = "The complete new contents."
required = true

[[tools.params]]
name = "overwrite"
type = "boolean"
description = "Replace the file if it exists. Defaults to false."

[[tools]]
name = "edit_text_file"
description = "Replace exactly one occurrence of a text in a UTF-8 file of the project workspace. Fails if the text is missing or occurs more than once."
capabilities = ["write_workspace"]

[[tools.params]]
name = "path"
type = "string"
description = "File path relative to the workspace root."
required = true

[[tools.params]]
name = "old_text"
type = "string"
description = "The exact text to replace."
required = true

[[tools.params]]
name = "new_text"
type = "string"
description = "Its replacement."
required = true

[[tools]]
name = "apply_patch"
description = "Apply a unified diff (as git diff or diff -u writes it) to files of the project workspace. It may change, create and delete several files, with several hunks each. Every hunk's context and removed lines must match the file exactly; a hunk that has moved applies where it matches nearest to its @@ line number. Nothing is written unless every file applies. Renames, mode changes and binary changes are not supported."
capabilities = ["write_workspace"]

[[tools.params]]
name = "patch"
type = "string"
description = "The unified diff: --- and +++ lines for each file (/dev/null for a created or deleted one), then @@ -start,count +start,count @@ hunks."
required = true

[[tools.params]]
name = "check_only"
type = "boolean"
description = "Check that the patch applies without writing anything. Defaults to false."

[[panels]]
id = "overview"
title = "Workspace overview"
capabilities = ["read_workspace"]

[[triggers]]
name = "file_changed"
description = "Fires when a file in the project is created, changed or removed, and reports the start of its new text. The first check only records the file."
capabilities = ["read_workspace"]

[[triggers.params]]
name = "path"
type = "string"
description = "File path relative to the workspace root."
required = true
