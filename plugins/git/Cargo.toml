[package]
name = "a206-plugin-git"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Bundled Agent 206 extension: read-only git status, log and diff tools."
publish = false
[lib]
crate-type = ["cdylib"]
[dependencies]
a206-extension-sdk = { path = "../../crates/extension-sdk" }
# See crates/extension-sdk/Cargo.toml: only the SDK's export macro needs unsafe attributes.
[lints.rust]
unsafe_code = "deny"
[lints.clippy]
dbg_macro = "deny"
todo = "deny"
let_underscore_must_use = "deny"
