id = "agent206.git"
name = "Git"
description = "Shows the status, history and diffs of a project's git repository and stages or commits named files, without running anything the repository configures."
version = "0.2.0"
abi = 2
capabilities = ["git_read", "git_write"]

[[tools]]
name = "git_status"
description = "List the branch, HEAD commit and changed paths (staged, unstaged and untracked) of the project's git repository."
capabilities = ["git_read"]

[[tools]]
name = "git_log"
description = "List the most recent commits reachable from HEAD, newest first, with id, author name, time and summary."
capabilities = ["git_read"]

[[tools.params]]
name = "max"
type = "integer"
description = "Most commits to list, from 1 to 200. Defaults to 20."

[[tools]]
name = "git_diff"
description = "Show a unified diff of one file: the index against the working tree, or HEAD against the index when staged is true."
capabilities = ["git_read"]

[[tools.params]]
name = "path"
type = "string"
description = "File path relative to the repository root."
required = true

[[tools.params]]
name = "staged"
type = "boolean"
description = "Diff the staged change instead of the unstaged one. Defaults to false."

[[tools]]
name = "git_commit"
description = "Commit the current working-tree content of exactly the named files on top of HEAD, like `git commit --only`. A named file that no longer exists is removed. Other staged changes stay staged. Refused when the repository signs commits, has commit hooks, is mid-merge or has no user.name and user.email."
capabilities = ["git_write"]

[[tools.params]]
name = "message"
type = "string"
description = "The commit message."
required = true

[[tools.params]]
name = "paths"
type = "string"
description = "Files to commit, one per line, relative to the repository root."
required = true

[[tools]]
name = "git_stage"
description = "Stage the current working-tree content of exactly the named files, like `git add` (a named file that no longer exists is staged as removed), or with unstage, set them back to their HEAD content, like `git reset -- <paths>`. Only the index changes; the files themselves are not touched."
capabilities = ["git_write"]

[[tools.params]]
name = "paths"
type = "string"
description = "Files to stage or unstage, one per line, relative to the repository root."
required = true

[[tools.params]]
name = "unstage"
type = "boolean"
description = "Unstage instead of staging. Defaults to false."
