id = "agent206.git"
name = "Git"
description = "Shows the status, history, branches, tags and diffs of a project's git repository, stages and commits changes, creates and switches branches, and creates tags, without running anything the repository configures."
version = "0.6.0"
abi = 2
capabilities = ["git_read", "git_write", "write_workspace"]

[[tools]]
name = "git_status"
description = "List the branch, HEAD commit and changed paths (staged, unstaged and untracked) of the project's git repository."
capabilities = ["git_read"]

[[tools]]
name = "git_log"
description = "List the most recent commits reachable from HEAD, newest first, with id, author name, time and summary."
capabilities = ["git_read"]

[[tools.params]]
name = "max"
type = "integer"
description = "Most commits to list, from 1 to 200. Defaults to 20."

[[tools]]
name = "git_branches"
description = "List the repository's local branches with the commit each points at, marking the current one."
capabilities = ["git_read"]

[[tools]]
name = "git_branch_create"
description = "Create a local branch at a commit without switching to it, like `git branch <name> [<start>]`. The working tree, index and current branch stay as they are. Refused when the branch exists, the repository has a reference-transaction hook, or user.name and user.email are not set."
capabilities = ["git_write"]

[[tools.params]]
name = "name"
type = "string"
description = "The new branch's name, such as feature/login."
required = true

[[tools.params]]
name = "start"
type = "string"
description = "A local branch name or full commit id to start from. Defaults to HEAD."

[[tools]]
name = "git_tags"
description = "List the repository's tags with the commit each names, marking annotated ones."
capabilities = ["git_read"]

[[tools]]
name = "git_tag_create"
description = "Create a tag at a commit, like `git tag <name> [<commit>]`, or with a message an annotated tag, like `git tag -a -m <message>`. The working tree, index and current branch stay as they are; the tag stays local until pushed. Refused when the tag exists, the repository has a reference-transaction hook, signs annotated tags (for an annotated tag), or user.name and user.email are not set."
capabilities = ["git_write"]

[[tools.params]]
name = "name"
type = "string"
description = "The new tag's name, such as v1.2.0."
required = true

[[tools.params]]
name = "commit"
type = "string"
description = "A local branch name or full commit id to tag. Defaults to HEAD."

[[tools.params]]
name = "message"
type = "string"
description = "Make an annotated tag with this message. Without one, the tag is a plain reference."

[[tools]]
name = "git_switch"
description = "Switch to an existing local branch, like `git switch <branch>`: the project's files and the index change to the branch's commit and it becomes the current branch. Refused when there are uncommitted or staged changes, when a file would replace an untracked or ignored one, and when the repository has checkout hooks, line-ending conversion, filters, submodules or symbolic links the switch would create."
capabilities = ["git_write", "write_workspace"]

[[tools.params]]
name = "name"
type = "string"
description = "The local branch to switch to, such as feature/login."
required = true

[[tools]]
name = "git_diff"
description = "Show a unified diff of one file: the index against the working tree, or HEAD against the index when staged is true."
capabilities = ["git_read"]

[[tools.params]]
name = "path"
type = "string"
description = "File path relative to the repository root."
required = true

[[tools.params]]
name = "staged"
type = "boolean"
description = "Diff the staged change instead of the unstaged one. Defaults to false."

[[tools]]
name = "git_commit"
description = "Commit the current working-tree content of exactly the named files on top of HEAD, like `git commit --only`; a named file that no longer exists is removed and other staged changes stay staged. Or, with staged, commit everything that is staged, like a plain `git commit`. Refused when the repository signs commits, has commit hooks, is mid-merge or has no user.name and user.email."
capabilities = ["git_write"]

[[tools.params]]
name = "message"
type = "string"
description = "The commit message."
required = true

[[tools.params]]
name = "paths"
type = "string"
description = "Files to commit, one per line, relative to the repository root. Required unless staged is true."

[[tools.params]]
name = "staged"
type = "boolean"
description = "Commit what is staged instead of named files. Defaults to false."

[[tools]]
name = "git_stage"
description = "Stage the current working-tree content of exactly the named files, like `git add` (a named file that no longer exists is staged as removed), or with unstage, set them back to their HEAD content, like `git reset -- <paths>`. Only the index changes; the files themselves are not touched."
capabilities = ["git_write"]

[[tools.params]]
name = "paths"
type = "string"
description = "Files to stage or unstage, one per line, relative to the repository root."
required = true

[[tools.params]]
name = "unstage"
type = "boolean"
description = "Unstage instead of staging. Defaults to false."
