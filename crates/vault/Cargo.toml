[package]
name = "a206-vault"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
[dependencies]
securestore = { version = "0.100.3", default-features = false, features = ["rustls"] }
zeroize.workspace = true
thiserror.workspace = true
tempfile.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
totp-rs = { version = "5.7", default-features = false, features = ["gen_secret", "otpauth"] }
ssh-key = { version = "0.6", default-features = false, features = ["std", "ed25519", "p256", "p384", "rand_core", "getrandom", "encryption"] }
ssh-encoding = { version = "0.2", default-features = false, features = ["alloc"] }
signature = { version = "2", default-features = false }
[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", features = ["fs"] }
[dev-dependencies]
uuid.workspace = true
[lints]
workspace = true
