[literate]
text = """
This is a Literate AI project (`literate.project.json`). Specifications (`component.md`), Flavors and pinned skills are its authority; generated source is disposable, so change intent where that authority lives. Follow the project's `SKILL.md`. Where you may run commands, prefer its `litai` commands to hand edits: `litai project guidance --operation develop` before changing the tree, `litai verify` for every declared gate, `litai work record` and `litai work close` for the queue, and `litai project guidance --operation land` to land. Ask before compiling or running generated code.
"""
