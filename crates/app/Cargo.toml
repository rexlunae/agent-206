[package]
name = "agent206"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
[features]
default = ["desktop"]
desktop = ["dioxus/desktop"]
web = ["a206-ui/web", "dioxus/web"]
tui = ["dep:dioxus-tui"]
[dependencies]
a206-ui.workspace = true
a206-core.workspace = true
dioxus = { workspace = true, features = ["launch"] }
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
a206-runtime.workspace = true
a206-protocol.workspace = true
a206-vault.workspace = true
a206-broker.workspace = true
a206-import.workspace = true
a206-extensions.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
clap = { version = "4", features = ["derive"] }
tokio.workspace = true
toml.workspace = true
rmp-serde.workspace = true
serde_json.workspace = true
serde.workspace = true
uuid.workspace = true
rpassword = "7"
dioxus-ssr.workspace = true
dioxus-tui = { git = "https://github.com/JakkuSakura/dioxus-tui", rev = "35c9ea58507f3ef75b4cd93f77b8fc28e332fc76", optional = true }
[target.'cfg(unix)'.dev-dependencies]
axum = "0.8"
tempfile.workspace = true
reqwest.workspace = true
[lints]
workspace = true
