[package]
name = "a206-broker"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
[dependencies]
a206-vault-channel.workspace = true
a206-protocol.workspace = true
a206-core.workspace = true
a206-vault.workspace = true
serde.workspace = true
serde_bytes = "0.11"
serde_json.workspace = true
toml.workspace = true
tempfile.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util = { version = "0.7", features = ["rt"] }
reqwest.workspace = true
futures-util.workspace = true
url.workspace = true
uuid.workspace = true
zeroize.workspace = true
fs2 = "0.4"
tracing.workspace = true
tokio-tungstenite = { version = "0.28", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
# IRC over TLS, with the same TLS stack and roots the WebSocket sessions use.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false }
webpki-roots = "1"
base64 = "0.22"
[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", features = ["user"] }
[dev-dependencies]
axum = { version = "0.8", features = ["ws"] }
signature = { version = "2", default-features = false }
ssh-encoding = { version = "0.2", default-features = false, features = ["alloc"] }
ssh-key = { version = "0.6", default-features = false, features = ["std", "ed25519"] }
totp-rs = { version = "5.7", default-features = false, features = ["otpauth"] }
[lints]
workspace = true
