[package]
name = "a206-ui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
[features]
default = []
web = ["dioxus/web", "fc-dioxus/web"]
[dependencies]
a206-vault-channel.workspace = true
zeroize.workspace = true
qrcode = { version = "0.14", default-features = false }
a206-core.workspace = true
a206-audit.workspace = true
a206-protocol.workspace = true
dioxus = { workspace = true, features = ["router"] }
fc-dioxus = { workspace = true, features = ["router"] }
uuid.workspace = true
serde.workspace = true
toml.workspace = true
futures-util.workspace = true
tracing.workspace = true
futures-timer = { version = "3", features = ["wasm-bindgen"] }
web-time = "1.1"
jiff = "0.2"
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
a206-runtime.workspace = true
a206-broker.workspace = true
tokio.workspace = true
[target.'cfg(target_arch = "wasm32")'.dependencies]
# The browser's clock and time zone, and IANA zones it has no files for.
jiff = { version = "0.2", features = ["js", "tzdb-bundle-always"] }
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["Window", "Location", "Storage", "History"] }
reqwest = { version = "0.12", default-features = false }
[dev-dependencies]
rqrr = { version = "0.11", default-features = false }
dioxus-ssr.workspace = true
[lints]
workspace = true
